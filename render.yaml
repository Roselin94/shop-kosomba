services:
  - type: web
    name: shop-kosomba
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SHOP_DATA_DIR
        value: /opt/render/project/src/.data

