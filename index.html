      <button class="nav-item" data-page="products" data-permission="Stock"><i data-lucide="package"></i>Produits <span class="count" id="nav-products">0</span></button>
      <button class="nav-item" data-page="documents" data-permission="Factures"><i data-lucide="file-text"></i>Factures & tickets</button>
    </nav>
    <div class="nav-label" style="margin-top:26px">Administration</div>
    <nav class="nav-list"><button class="nav-item" data-page="users" data-permission="Utilisateurs"><i data-lucide="users"></i>Équipe & permissions</button></nav>
    <div class="sidebar-bottom"><div class="workspace-switch"><div class="workspace-avatar">SK</div><div class="workspace-meta">Shop Kosomba<small>Brazzaville · Congo</small></div><i data-lucide="chevrons-up-down" style="width:15px;margin-left:auto;color:#ffb3b3"></i></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="top-actions"><button class="icon-button mobile-menu" id="menu-toggle" aria-label="Ouvrir le menu"><i data-lucide="menu"></i></button><div class="crumb">Shop Kosomba <span style="color:#c4cbc4;padding:0 7px">/</span><strong id="breadcrumb">Vue d'ensemble</strong></div></div><div class="top-actions"><button class="icon-button" id="quick-add" title="Ajouter un produit"><i data-lucide="plus"></i></button><div class="notification-wrap"><button class="icon-button" id="notification-button" title="Notifications" aria-label="Notifications" aria-controls="notification-panel" aria-expanded="false"><i data-lucide="bell"></i><span class="notification-count" id="notification-count" hidden></span></button><div class="notification-panel" id="notification-panel" hidden></div></div><div class="user-pill"><div class="user-pic" id="user-pic">SK</div><span id="user-name">Admin Shop Kosomba</span></div><button class="icon-button" id="logout-button" title="Se déconnecter" aria-label="Se déconnecter"><i data-lucide="log-out"></i></button></div></header>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="auth-root"></div>
<div id="modal-root"></div><div id="toast-root"></div>
<script>
let state=null,currentUser=null,stateRevision=0,pendingPasswords={},saveQueue=Promise.resolve(),savingCount=0,pollBusy=false,notifications=[];
let currentPage='dashboard',cart=[],saleType='Ticket',productFilter='Tous';
const titles={dashboard:'Vue d’ensemble',sales:'Point de vente',products:'Produits & stocks',documents:'Factures & tickets',users:'Équipe & permissions'};
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'XAF',maximumFractionDigits:0}).format(Number(n)||0);
const dateFmt=d=>new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(d));
const timeAgo=d=>{let h=Math.floor((Date.now()-new Date(d))/3600000);return h<1?'À l’instant':h<24?`Il y a ${h} h`:`Il y a ${Math.floor(h/24)} j`};
async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let result={};try{result=await response.json()}catch{}if(!response.ok){let error=new Error(result.error||'Erreur de communication avec le serveur.');error.status=response.status;error.revision=result.revision;throw error}return result}
function showAuth(mode,message=''){
  document.getElementById('app-shell').classList.add('auth-hidden');
  const root=document.getElementById('auth-root'),setup=mode==='setup';
  root.innerHTML=`<main class="auth-screen"><section class="auth-brand"><div><div class="auth-brand-mark">SHOP KOSOMBA</div><h1>Gestion commerciale</h1><p>Vos ventes, vos stocks et votre équipe, réunis dans un seul espace.</p></div><div class="auth-address">30, rue Louomo CEG de la paix Moungali<br>Congo-Brazzaville</div></section><section class="auth-content"><div class="auth-form-wrap"><div class="eyebrow">Espace sécurisé · XAF</div><h2>${setup?'Créer le compte administrateur':'Connexion'}</h2><p>${setup?'Configurez le premier compte qui gérera les ventes, le stock et les accès de l’équipe.':'Connectez-vous à votre espace Shop Kosomba.'}</p>${message?`<div class="auth-error" role="alert">${esc(message)}</div>`:''}${mode==='offline'?`<button class="button primary" onclick="bootstrap()">${icon('refresh-cw')} Réessayer</button>`:`<form class="auth-form" onsubmit="${setup?'setupAccount(event)':'login(event)'}">${setup?`<div class="field"><label for="auth-name">Nom complet</label><input id="auth-name" name="name" required autocomplete="name" minlength="2"></div>`:''}<div class="field"><label for="auth-email">Adresse e-mail</label><input id="auth-email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="auth-password">${setup?'Mot de passe (12 caractères minimum)':'Mot de passe'}</label><input id="auth-password" name="password" type="password" required autocomplete="${setup?'new-password':'current-password'}" ${setup?'minlength="12"':''}></div><button class="button primary" type="submit">${setup?'Créer mon compte':'Se connecter'} ${icon('arrow-right')}</button></form><p class="auth-note">Les données sont conservées sur le serveur de la boutique. Vos accès dépendent des permissions attribuées à votre compte.</p>`}</div></section></main>`;
  if(window.lucide)lucide.createIcons()
}
async function loadApp(){const result=await api('/api/state');state=result.state;stateRevision=result.revision;document.getElementById('auth-root').innerHTML='';document.getElementById('app-shell').classList.remove('auth-hidden');currentPage='dashboard';syncIdentity();render();await refreshNotifications()}
async function bootstrap(){try{const status=await api('/api/setup-status');if(status.required){currentUser=null;showAuth('setup');return}const session=await api('/api/me');currentUser=session.user;await loadApp()}catch(error){if(error.status===401){currentUser=null;showAuth('login')}else showAuth('offline','Le serveur est inaccessible. Lancez Shop Kosomba avec `npm start`, puis réessayez.')}}
async function setupAccount(event){event.preventDefault();const form=event.currentTarget,data=Object.fromEntries(new FormData(form));try{const result=await api('/api/setup',{method:'POST',body:JSON.stringify(data)});currentUser=result.user;await loadApp()}catch(error){showAuth('setup',error.message)}}
async function login(event){event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));try{const result=await api('/api/login',{method:'POST',body:JSON.stringify(data)});currentUser=result.user;await loadApp()}catch(error){showAuth('login',error.message)}}
async function logout(){try{await api('/api/logout',{method:'POST',body:'{}'})}catch{}currentUser=null;state=null;notifications=[];document.getElementById('notification-panel').hidden=true;document.getElementById('notification-count').hidden=true;showAuth('login')}
function syncIdentity(){if(!currentUser)return;document.getElementById('user-name').textContent=currentUser.name;document.getElementById('user-pic').textContent=initials(currentUser.name)}
async function refreshNotifications(){if(currentUser?.role!=='Administratrice'){notifications=[];updateNotificationBadge();return}try{const result=await api('/api/notifications');notifications=result.notifications;updateNotificationBadge();if(!document.getElementById('notification-panel').hidden)renderNotificationPanel()}catch(error){if(error.status===401)await logout()}}
function updateNotificationBadge(){const count=notifications.filter(item=>!item.readAt).length,badge=document.getElementById('notification-count'),button=document.getElementById('notification-button');badge.textContent=count>99?'99+':count;badge.hidden=!count;button.title=count?`${count} notification${count>1?'s':''} non lue${count>1?'s':''}`:'Notifications';button.setAttribute('aria-label',button.title)}
function renderNotificationPanel(){const panel=document.getElementById('notification-panel');panel.innerHTML=`<div class="notification-head"><strong>Notifications</strong>${notifications.some(item=>!item.readAt)?'<button class="notification-read-all" id="mark-all-read">Tout marquer comme lu</button>':''}</div>${notifications.length?`<div class="notification-list">${notifications.map(item=>`<button type="button" class="notification-row ${item.readAt?'':'unread'}" data-notification-id="${esc(item.id)}"><span class="notification-mark">${icon('shopping-bag')}</span><span><span class="notification-title">Nouvelle vente · ${esc(item.soldBy)}</span><span class="notification-detail">${esc(item.type)} ${esc(item.documentId)} · ${item.itemCount} article${item.itemCount===1?'':'s'} · ${money(item.total)}</span><span class="notification-detail">${esc(item.client)}</span></span><span class="notification-time">${timeAgo(item.createdAt)}</span></button>`).join('')}</div>`:'<div class="notification-empty">Aucune notification de vente pour le moment.</div>'}`;panel.querySelectorAll('[data-notification-id]').forEach(button=>button.addEventListener('click',()=>openSaleNotification(button.dataset.notificationId)));panel.querySelector('#mark-all-read')?.addEventListener('click',markAllNotificationsRead);if(window.lucide)lucide.createIcons()}
async function toggleNotificationPanel(){if(currentUser?.role!=='Administratrice'){const low=state.products.filter(product=>product.stock<=product.threshold).length;toast(low?`${low} produit${low>1?'s':''} à réapprovisionner.`:'Aucune alerte de stock.');return}const panel=document.getElementById('notification-panel'),button=document.getElementById('notification-button');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden){await refreshNotifications();renderNotificationPanel()}}
async function markAllNotificationsRead(){try{await api('/api/notifications/read',{method:'POST',body:JSON.stringify({all:true})});notifications=notifications.map(item=>({...item,readAt:item.readAt||new Date().toISOString()}));updateNotificationBadge();renderNotificationPanel()}catch(error){toast(error.message,true)}}
async function openSaleNotification(id){const item=notifications.find(notification=>notification.id===id);if(!item)return;try{await api('/api/notifications/read',{method:'POST',body:JSON.stringify({ids:[id]})});notifications=notifications.map(notification=>notification.id===id?{...notification,readAt:new Date().toISOString()}:notification);updateNotificationBadge();document.getElementById('notification-panel').hidden=true;document.getElementById('notification-button').setAttribute('aria-expanded','false');go('documents');showDocument(item.documentId)}catch(error){toast(error.message,true)}}
async function reloadState(){const result=await api('/api/state');state=result.state;stateRevision=result.revision;syncIdentity();render()}
function save(){updateBadges();const snapshot=structuredClone(state),passwords={...pendingPasswords};pendingPasswords={};const task=saveQueue.then(async()=>{savingCount++;try{const result=await api('/api/state',{method:'PUT',body:JSON.stringify({state:snapshot,revision:stateRevision,passwords})});stateRevision=result.revision;currentUser=state.users.find(user=>user.id===currentUser.id)||currentUser;syncIdentity();return true}finally{savingCount--}});saveQueue=task.catch(async error=>{toast(error.message,true);try{await reloadState()}catch{await logout()}return false});return saveQueue}
function updateBadges(){document.getElementById('nav-products').textContent=state.products.length;const low=state.products.filter(p=>p.stock<=p.threshold).length;document.getElementById('notification-button').title=low?`${low} alerte${low>1?'s':''} de stock`: 'Aucune alerte de stock'}
function icon(name){return `<i data-lucide="${name}"></i>`}
function can(permission){return Boolean(currentUser?.permissions.includes(permission))}

function initCharts() {
  if (window.salesChartInstance) window.salesChartInstance.destroy();
  if (window.stockChartInstance) window.stockChartInstance.destroy();

  setTimeout(() => {
    const salesCtx = document.getElementById('salesChart');
    const stockCtx = document.getElementById('stockChart');
    if (!salesCtx || !stockCtx) return;

    const last7Days = Array.from({length: 7}, (_, i) => {
      const d = new Date();
      d.setDate(d.getDate() - i);
      return d.toDateString();
    }).reverse();

    const salesData = last7Days.map(day => {
      return state.documents
        .filter(doc => new Date(doc.date).toDateString() === day)
        .reduce((sum, doc) => sum + doc.total, 0);
    });

    const labels = last7Days.map(day => {
      const d = new Date(day);
      return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    });

    window.salesChartInstance = new Chart(salesCtx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Ventes (€)',
          data: salesData,
          borderColor: '#e50000',
          backgroundColor: 'rgba(229, 0, 0, 0.1)',
          tension: 0.3,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });

    const topProducts = [...state.products].sort((a, b) => b.stock - a.stock).slice(0, 10);
    window.stockChartInstance = new Chart(stockCtx, {
      type: 'bar',
      data: {
        labels: topProducts.map(p => p.name.length > 15 ? p.name.substring(0, 15) + '...' : p.name),
        datasets: [{
          label: 'Stock',
          data: topProducts.map(p => p.stock),
          backgroundColor: '#b84339'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }, 100);
}

function render(){
  if(!state||!currentUser)return;
  document.getElementById('breadcrumb').textContent=titles[currentPage];
  document.querySelectorAll('.nav-item[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===currentPage);b.hidden=b.dataset.permission?!can(b.dataset.permission):false});
  document.getElementById('quick-add').hidden=!can('Stock');
  const content=document.getElementById('content');
  content.dataset.page=currentPage;
  content.innerHTML=`<section class="screen">${({dashboard:dashboardPage,sales:salesPage,products:productsPage,documents:documentsPage,users:usersPage})[currentPage]()}</section>`;
  if(currentPage==='sales'){
    const query=(document.getElementById('catalog-search')?.value||'').toLowerCase();
    const visibleProducts=state.products.filter(p=>p.stock>0&&(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes(query));
    content.querySelectorAll('.catalog-item').forEach((item,index)=>{
      const product=visibleProducts[index];
      if(!product)return;
      const art=item.querySelector('.catalog-art'),name=item.querySelector('.catalog-name'),meta=item.querySelector('.catalog-meta');
      if(product.photo){const image=document.createElement('img');image.src=product.photo;image.alt=`Photo : ${product.name}`;image.loading='lazy';art.replaceChildren(image)}
      const info=document.createElement('div');info.className='catalog-info';info.append(name,meta);item.append(info);
      const stock=meta.querySelector('.catalog-stock');
      if(stock&&product.stock<=product.threshold){stock.classList.add('low');stock.textContent=`Stock bas · ${product.stock}`}
    });
    if(currentUser.role==='Administratrice'){
      const button=document.createElement('button');button.className='button primary';button.type='button';button.innerHTML=`${icon('plus')} Nouveau produit`;button.addEventListener('click',()=>openProduct('',true));content.querySelector('.catalog .toolbar').append(button)
    }
  }
  if(window.lucide)lucide.createIcons();
  if(currentPage === 'dashboard') initCharts();
  updateBadges()
}
function pageHead(title,sub,button=''){const heading=title==='Bonjour Marie'?'Bienvenue chez Shop Kosomba':title;return `<div class="page-head"><div><div class="eyebrow">Shop Kosomba · ${new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</div><h1>${heading}</h1><p>${sub}</p></div>${button}</div>`}
function stockBadge(p){return p.stock===0?'<span class="badge danger"><span class="dot"></span>Épuisé</span>':p.stock<=p.threshold?'<span class="badge warn"><span class="dot"></span>Stock bas</span>':'<span class="badge"><span class="dot"></span>En stock</span>'}
function productCell(p){return `<div class="product-cell"><div class="product-thumb">${p.photo?`<img src="${esc(p.photo)}" alt="">`:icon('package')}</div><div><div class="product-name">${esc(p.name)}</div><div class="subline">${esc(p.sku)} · ${esc(p.category)}</div></div></div>`}
function dashboardPage(){let today=new Date().toDateString(),todayDocs=state.documents.filter(d=>new Date(d.date).toDateString()===today),sales=todayDocs.reduce((s,d)=>s+d.total,0),low=state.products.filter(p=>p.stock<=p.threshold).sort((a,b)=>a.stock-b.stock),recent=[...state.documents].slice(0,4);return `${pageHead('Bonjour Marie','Voici ce qui se passe dans votre boutique aujourd’hui.',`<button class="button primary" onclick="go('sales')">${icon('plus')} Nouvelle vente</button>`)}<div class="grid stats"><article class="stat-card"><div class="stat-top">Ventes du jour <span class="stat-icon">${icon('chart-no-axes-combined')}</span></div><div class="stat-value">${money(sales||248.5)}</div><div class="stat-foot"><span class="positive">+12,8 %</span> par rapport à hier</div></article><article class="stat-card"><div class="stat-top">Commandes aujourd’hui <span class="stat-icon">${icon('shopping-bag')}</span></div><div class="stat-value">${todayDocs.length||12}</div><div class="stat-foot"><span class="positive">+3</span> depuis l’ouverture</div></article><article class="stat-card"><div class="stat-top">Références en stock <span class="stat-icon">${icon('package-check')}</span></div><div class="stat-value">${state.products.length}</div><div class="stat-foot">${low.length} sous le seuil d’alerte</div></article><article class="stat-card"><div class="stat-top">Valeur du stock <span class="stat-icon">${icon('wallet')}</span></div><div class="stat-value">${money(state.products.reduce((s,p)=>s+p.stock*p.cost,0))}</div><div class="stat-foot">Valorisation au prix d’achat</div></article></div><div class="grid dashboard-grid"><section class="panel"><div class="panel-head"><div class="panel-title">Évolution des ventes (7 derniers jours)</div></div><div style="padding:15px; height:300px;"><canvas id="salesChart"></canvas></div></section><section class="panel"><div class="panel-head"><div class="panel-title">Top 10 Produits en Stock</div></div><div style="padding:15px; height:300px;"><canvas id="stockChart"></canvas></div></section></div><div class="grid dashboard-grid"><div><section class="panel"><div class="panel-head"><div><div class="panel-title">Dernières ventes</div><div class="panel-subtitle">Activité récente de la boutique</div></div><button class="text-link" onclick="go('documents')">Tout voir →</button></div><div class="table-wrap"><table><thead><tr><th>Document</th><th>Client</th><th>Date</th><th>Montant</th><th>Statut</th></tr></thead><tbody>${recent.map(d=>`<tr><td><span class="doc-number">${d.id}</span><div class="subline">${d.type}</div></td><td>${esc(d.client)}</td><td>${dateFmt(d.date)}</td><td><strong>${money(d.total)}</strong></td><td><span class="badge">${d.status}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty-state">Aucune vente pour le moment.</td></tr>'}</tbody></table></div></section><section class="panel low-stock"><div class="panel-head"><div><div class="panel-title">À réapprovisionner</div><div class="panel-subtitle">Produits au seuil d’alerte ou en dessous</div></div><button class="text-link" onclick="go('products')">Gérer le stock →</button></div><div class="low-stock-list">${low.slice(0,4).map(p=>`<div class="low-row"><span>${esc(p.name)}</span><span class="low-num">${p.stock} restant${p.stock>1?'s':''}</span></div>`).join('')||'<div class="empty-state">Tous vos produits sont bien approvisionnés.</div>'}</div></section></div><section class="panel"><div class="panel-head"><div><div class="panel-title">Activité récente</div><div class="panel-subtitle">Les derniers mouvements de la boutique</div></div></div><div class="activity-list">${(state.activity.length?state.activity:[{text:'Bienvenue dans Atelier ! Votre espace est prêt.',date:new Date().toISOString(),icon:'sparkles'},{text:'Vos alertes de stock apparaîtront ici.',date:new Date().toISOString(),icon:'package'}]).slice(0,6).map(a=>`<div class="activity"><div class="activity-mark">${icon(a.icon||'circle-dot')}</div><div><div class="activity-text">${a.text}</div><div class="activity-time">${timeAgo(a.date)}</div></div></div>`).join('')}</div></section></div>`}
function productsPage(){let q=(document.getElementById('product-search')?.value||'').toLowerCase(),cat=document.getElementById('product-category')?.value||'Tous',rows=state.products.filter(p=>(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes(q)&&(cat==='Tous'||p.category===cat));return `${pageHead('Produits & stocks','Suivez vos références, vos seuils et la valeur de votre inventaire.',`<button class="button" onclick="document.getElementById('import-file').click()">${icon('upload')} Importer</button><input type="file" id="import-file" style="display:none" accept=".xlsx, .xls, .csv" onchange="importProducts(event)"><button class="button primary" onclick="openProduct()">${icon('plus')} Nouveau produit</button>`)}<section class="panel"><div class="toolbar"><div class="toolbar-left"><label class="search">${icon('search')}<input id="product-search" placeholder="Rechercher un produit, SKU, code-barres…" value="${esc(document.getElementById('product-search')?.value||'')}" oninput="refreshProducts()"></label><select class="filter-select" id="product-category" onchange="refreshProducts()"><option>Tous</option>${[...new Set(state.products.map(p=>p.category))].map(c=>`<option ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="toolbar-right"><span style="font-size:11px;color:var(--muted)">${rows.length} référence${rows.length>1?'s':''}</span></div></div><div class="table-wrap"><table><thead><tr><th>Produit</th><th>Prix de vente</th><th>Stock disponible</th><th>Code-barres</th><th>Statut</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${productCell(p)}</td><td><strong>${money(p.price)}</strong><div class="subline">Achat ${money(p.cost)}</div></td><td><strong>${p.stock}</strong><span class="stock-bar ${p.stock<=p.threshold?'low':''}"><i style="width:${Math.min(100,Math.round(p.stock/Math.max(1,p.threshold*2)*100))}%"></i></span><div class="subline">Seuil : ${p.threshold}</div></td><td style="font-family:monospace;color:#68746b">${esc(p.barcode||'—')}</td><td>${stockBadge(p)}</td><td><div class="table-actions"><button class="small-icon" title="Modifier" onclick="openProduct('${p.id}')">${icon('pencil')}</button><button class="small-icon" title="Ajuster le stock" onclick="adjustStock('${p.id}')">${icon('arrow-left-right')}</button><button class="small-icon" title="Supprimer" onclick="deleteProduct('${p.id}')">${icon('trash-2')}</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty-state">Aucun produit correspondant.</td></tr>'}</tbody></table></div></section>`}
function refreshProducts(){let input=document.getElementById('product-search'),select=document.getElementById('product-category'),q=input.value,cat=select.value;render();document.getElementById('product-search').value=q;document.getElementById('product-category').value=cat;document.getElementById('product-search').focus();document.getElementById('product-search').setSelectionRange(q.length,q.length)}

function log(text,iconName){state.activity.unshift({text,date:new Date().toISOString(),icon:iconName});state.activity=state.activity.slice(0,20)}
document.getElementById('navigation').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.getElementById('quick-add').addEventListener('click',()=>openProduct());document.getElementById('notification-button').addEventListener('click',toggleNotificationPanel);document.addEventListener('click',event=>{if(event.target.closest('.notification-wrap'))return;const panel=document.getElementById('notification-panel');panel.hidden=true;document.getElementById('notification-button').setAttribute('aria-expanded','false')});document.getElementById('menu-toggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('logout-button').addEventListener('click',logout);
document.getElementById('content').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.id!=='catalog-search')return;e.preventDefault();let value=e.target.value.trim().toLowerCase(),product=state.products.find(p=>p.barcode?.toLowerCase()===value||p.sku.toLowerCase()===value);if(!product)return toast('Code-barres ou référence inconnue.',true);if(product.stock<1)return toast('Ce produit est en rupture de stock.',true);addToCart(product.id);let input=document.getElementById('catalog-search');input.value='';input.focus()});
const barcodeObserver=new MutationObserver(()=>{const barcode=document.querySelector('#modal-root .barcode:not(svg)');if(!barcode||!window.JsBarcode)return;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),value=document.querySelector('#modal-root .barcode-number')?.textContent.trim();if(!value)return;svg.classList.add('barcode');svg.setAttribute('role','img');svg.setAttribute('aria-label',barcode.getAttribute('aria-label')||'Code-barres');barcode.replaceWith(svg);JsBarcode(svg,value,{format:'CODE128',displayValue:false,height:42,width:1.25,margin:0,lineColor:'#202923'});});
barcodeObserver.observe(document.getElementById('modal-root'),{childList:true,subtree:true});
bootstrap();
setInterval(async()=>{if(!currentUser||savingCount||pollBusy)return;pollBusy=true;try{const result=await api('/api/state');if(result.revision!==stateRevision){state=result.state;stateRevision=result.revision;syncIdentity();render()}await refreshNotifications()}catch(error){if(error.status===401)await logout()}finally{pollBusy=false}},4000);
</script>
</body>
</html>
