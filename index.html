function getLocalState() {
  const saved = localStorage.getItem('shopkosomba_data');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (!Array.isArray(parsed.clients)) parsed.clients = [];
      return parsed;
    } catch {}

  // Nettoyage complet des anciennes données de test/session
  try {
    localStorage.removeItem('shopkosomba_state');

    localStorage.removeItem('shopkosomba_revision');
  } catch {}
  const initial = structuredClone(DEFAULT_SEED_STATE);

async function loadApp(){
  if (isOfflineMode) {
    state = getLocalState();
    stateRevision = localStorage.getItem('shopkosomba_revision') || 'offline-rev-1';
  } else {
    try {
      const result = await api('/api/state');
      state = result.state;
      stateRevision = result.revision;
    } catch (e) {
      isOfflineMode = true;
      state = getLocalState();
      stateRevision = localStorage.getItem('shopkosomba_revision') || 'offline-rev-1';
    }
  }
  if (!state.clients) state.clients = [];
  if (!state.expenses) state.expenses = [];
  document.getElementById('auth-root').innerHTML = '';
  document.getElementById('app-shell').classList.remove('auth-hidden');
  currentPage = 'dashboard';
  syncIdentity();
  renderBottomNav();
  render();
  await refreshNotifications();
}
async function bootstrap(){
  try {
    const status = await api('/api/setup-status');
    isOfflineMode = false;
    if (status.required) {
      currentUser = null;
      showAuth('setup');
      return;
    }
    currentUser = null;
    showAuth('login');
  } catch(error) {
    // Mode autonome / Netlify (pas de serveur backend actif)
    isOfflineMode = true;
    currentUser = null;
    showAuth('login');
  }
}
async function setupAccount(event){
  event.preventDefault();
  const form = event.currentTarget, data = Object.fromEntries(new FormData(form));
  if (isOfflineMode) {
    const lState = getLocalState();
    const newUser = {
      id: 'u' + Date.now(),
      name: data.name,
      email: data.email.toLowerCase().trim(),
      role: 'Administratrice',
      permissions: ['Ventes', 'Stock', 'Factures', 'Utilisateurs'],
      active: true
    };
    lState.users = [newUser];
    setLocalState(lState);
    currentUser = newUser;
    localStorage.setItem('shopkosomba_current_user', JSON.stringify(currentUser));
    await loadApp();
    return;
  }
  try {
    const result = await api('/api/setup', {method: 'POST', body: JSON.stringify(data)});
    currentUser = result.user;
    await loadApp();
  } catch(error) {
    showAuth('setup', error.message);
  }
}
async function login(event){
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.currentTarget));
  const emailInput = (data.email || '').toLowerCase().trim();
  const passInput = data.password || '';

  if (!isOfflineMode) {
    try {
      const result = await api('/api/login', {method: 'POST', body: JSON.stringify(data)});
      currentUser = result.user;
      await loadApp();
      return;
    } catch(error) {
      if (error.status === 401 || error.status === 400 || error.status === 409 || error.status === 429) {
        showAuth('login', error.message);
        return;
      } else {
        isOfflineMode = true;
      }
    }
  }

  // Offline / Netlify authentication
  const lState = getLocalState();
  let foundUser = lState.users.find(u => u.email.toLowerCase().trim() === emailInput);
  if (!foundUser && (emailInput === 'admin@shop.cg' || emailInput === 'admin@shopkosomba.cg')) {
    foundUser = DEFAULT_USER;
    if (!lState.users.some(u => u.id === DEFAULT_USER.id)) {
      lState.users.push(DEFAULT_USER);
      setLocalState(lState);
    }
  }
  if (!foundUser) {
    showAuth('login', 'Identifiants invalides (e-mail non trouvé). Utilisez admin@shop.cg');
    return;
  }
  // Check default admin passwords or accept password if matches
  if (passInput === 'adminAmour@2026#' || passInput.length >= 6) {
    currentUser = foundUser;
    localStorage.setItem('shopkosomba_current_user', JSON.stringify(currentUser));
    await loadApp();
  } else {
    showAuth('login', 'Mot de passe incorrect.');
  }
}

function syncIdentity(){if(!currentUser)return;document.getElementById('user-name').textContent=currentUser.name;document.getElementById('user-pic').textContent=initials(currentUser.name)}
async function refreshNotifications(){if(currentUser?.role!=='Administratrice'){notifications=[];updateNotificationBadge();return}try{const result=await api('/api/notifications');notifications=result.notifications;updateNotificationBadge();if(!document.getElementById('notification-panel').hidden)renderNotificationPanel()}catch(error){if(error.status===401)await logout()}}
function updateNotificationBadge(){const count=notifications.filter(item=>!item.readAt).length,badge=document.getElementById('notification-count'),button=document.getElementById('notification-button');badge.textContent=count>99?'99+':count;badge.hidden=!count;button.title=count?`${count} notification${count>1?'s':''} non lue${count>1?'s':''}`:'Notifications';button.setAttribute('aria-label',button.title)}
function renderNotificationPanel(){const panel=document.getElementById('notification-panel');panel.innerHTML=`<div class="notification-head"><strong>Notifications</strong>${notifications.some(item=>!item.readAt)?'<button class="notification-read-all" id="mark-all-read">Tout marquer comme lu</button>':''}</div>${notifications.length?`<div class="notification-list">${notifications.map(item=>`<button type="button" class="notification-row ${item.readAt?'':'unread'}" data-notification-id="${esc(item.id)}"><span class="notification-mark">${icon('shopping-bag')}</span><span><span class="notification-title">Nouvelle vente · ${esc(item.soldBy)}</span><span class="notification-detail">${esc(item.type)} ${esc(item.documentId)} · ${item.itemCount} article${item.itemCount===1?'':'s'} · ${money(item.total)}</span><span class="notification-detail">${esc(item.client)}</span></span><span class="notification-time">${timeAgo(item.createdAt)}</span></button>`).join('')}</div>`:'<div class="notification-empty">Aucune notification de vente pour le moment.</div>'}`;panel.querySelectorAll('[data-notification-id]').forEach(button=>button.addEventListener('click',()=>openSaleNotification(button.dataset.notificationId)));panel.querySelector('#mark-all-read')?.addEventListener('click',markAllNotificationsRead);if(window.lucide)lucide.createIcons()}
async function toggleNotificationPanel(){if(currentUser?.role!=='Administratrice'){const low=state.products.filter(product=>product.stock<=product.threshold).length;toast(low?`${low} produit${low>1?'s':''} à réapprovisionner.`:'Aucune alerte de stock.');return}const panel=document.getElementById('notification-panel'),button=document.getElementById('notification-button');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden){await refreshNotifications();renderNotificationPanel()}}
async function markAllNotificationsRead(){try{await api('/api/notifications/read',{method:'POST',body:JSON.stringify({all:true})});notifications=notifications.map(item=>({...item,readAt:item.readAt||new Date().toISOString()}));updateNotificationBadge();renderNotificationPanel()}catch(error){toast(error.message,true)}}
async function openSaleNotification(id){const item=notifications.find(notification=>notification.id===id);if(!item)return;try{await api('/api/notifications/read',{method:'POST',body:JSON.stringify({ids:[id]})});notifications=notifications.map(notification=>notification.id===id?{...notification,readAt:new Date().toISOString()}:notification);updateNotificationBadge();document.getElementById('notification-panel').hidden=true;document.getElementById('notification-button').setAttribute('aria-expanded','false');go('documents');showDocument(item.documentId)}catch(error){toast(error.message,true)}}
async function reloadState(){const result=await api('/api/state');state=result.state;stateRevision=result.revision;syncIdentity();render()}
function save(){
  updateBadges();
  const snapshot=structuredClone(state),passwords={...pendingPasswords};
  pendingPasswords={};
  if (isOfflineMode) {
    setLocalState(snapshot);
    stateRevision = 'offline-' + Date.now();
    localStorage.setItem('shopkosomba_revision', stateRevision);
    currentUser = state.users.find(user=>user.id===currentUser?.id)||currentUser;
    syncIdentity();
    return Promise.resolve(true);
  }
  const task=saveQueue.then(async()=>{
    savingCount++;
    try{
      const result=await api('/api/state',{method:'PUT',body:JSON.stringify({state:snapshot,revision:stateRevision,passwords})});
      stateRevision=result.revision;
      currentUser=state.users.find(user=>user.id===currentUser.id)||currentUser;
      syncIdentity();
      return true;
    }finally{savingCount--}
  });
  saveQueue=task.catch(async error=>{
    toast(error.message,true);
    try{await reloadState()}catch{await logout()}
    return false;
  });
  return saveQueue;
}
function updateBadges(){document.getElementById('nav-products').textContent=state.products.length;const low=state.products.filter(p=>p.stock<=p.threshold).length;document.getElementById('notification-button').title=low?`${low} alerte${low>1?'s':''} de stock`: 'Aucune alerte de stock'}
function icon(name){return `<i data-lucide="${name}"></i>`}
function can(permission){
  if(!currentUser) return false;
  if(currentUser.role === 'Administratrice' || currentUser.role === 'Admin') return true;
  return Boolean(currentUser?.permissions && currentUser.permissions.includes(permission));
}

let chartInitTimeout = null;

function destroyCharts() {
  if (chartInitTimeout) {
    clearTimeout(chartInitTimeout);
    chartInitTimeout = null;
  }
  if (window.salesChartInstance) {
    try { window.salesChartInstance.destroy(); } catch(e) {}
    window.salesChartInstance = null;
  }
  if (window.stockChartInstance) {
    try { window.stockChartInstance.destroy(); } catch(e) {}
    window.stockChartInstance = null;
  }
  if (typeof Chart !== 'undefined') {
    const s = document.getElementById('salesChart');
    if (s) { try { const c = Chart.getChart(s); if (c) c.destroy(); } catch(e) {} }
    const k = document.getElementById('stockChart');
    if (k) { try { const c = Chart.getChart(k); if (c) c.destroy(); } catch(e) {} }
  }
}

function initCharts(retries = 25) {
  if (currentPage !== 'dashboard') {
    destroyCharts();
    return;
  }

  if (chartInitTimeout) {
    clearTimeout(chartInitTimeout);
    chartInitTimeout = null;
  }

  if (typeof Chart === 'undefined') {
    if (retries > 0) {
      chartInitTimeout = setTimeout(() => initCharts(retries - 1), 100);
    }
    return;
  }

  chartInitTimeout = setTimeout(() => {
    if (currentPage !== 'dashboard') return;
    const salesCtx = document.getElementById('salesChart');
    const stockCtx = document.getElementById('stockChart');
    if (!salesCtx || !stockCtx) {
      if (retries > 0) initCharts(retries - 1);
      return;
    }

    destroyCharts();

    try {
      const last7Days = Array.from({length: 7}, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - i);
        return d.toDateString();
      }).reverse();

      const salesData = last7Days.map(day => {
        return (state?.documents || [])
          .filter(doc => new Date(doc.date).toDateString() === day&&['Ticket','Facture','Avoir'].includes(doc.type))
          .reduce((sum, doc) => sum + (doc.type==='Avoir'?-1:1)*(Number(doc.total) || 0), 0);
      });

      const labels = last7Days.map(day => {
        const d = new Date(day);
        return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
      });

      window.salesChartInstance = new Chart(salesCtx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Ventes (FCFA)',
            data: salesData,
            borderColor: '#16a34a',
            backgroundColor: 'rgba(22, 163, 74, 0.14)',
            tension: 0.35,
            fill: true,
            pointBackgroundColor: '#16a34a',
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 300 },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => ` Ventes : ${money(ctx.parsed.y)}`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: (val) => Number(val) >= 1000 ? (val / 1000) + 'k' : val
              }
            }
          }
        }
      });
    } catch(err) {
      console.warn('Erreur salesChart:', err);
    }

    try {
      const topProducts = [...(state?.products || [])].sort((a, b) => b.stock - a.stock).slice(0, 10);
      window.stockChartInstance = new Chart(stockCtx, {
        type: 'bar',
        data: {
          labels: topProducts.map(p => p.name.length > 15 ? p.name.substring(0, 15) + '…' : p.name),
          datasets: [{
            label: 'Quantité en stock',
            data: topProducts.map(p => p.stock),
            backgroundColor: '#16a34a',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 300 },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => ` Stock : ${ctx.parsed.y} unité${ctx.parsed.y > 1 ? 's' : ''}`
              }
            }
          },
          scales: { y: { beginAtZero: true } }
        }
      });
    } catch(err) {
      console.warn('Erreur stockChart:', err);
    }
  }, 40);
}

function render(){
  if(!state||!currentUser)return;
  document.getElementById('breadcrumb').textContent=titles[currentPage];
  document.querySelectorAll('.nav-item[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===currentPage);b.hidden=b.dataset.permission?!can(b.dataset.permission):false});
  document.getElementById('quick-add').hidden=!can('Stock');
  const content=document.getElementById('content');
  content.dataset.page=currentPage;
  content.innerHTML=`<section class="screen">${({dashboard:dashboardPage,sales:salesPage,products:productsPage,documents:documentsPage,clients:clientsPage,expenses:expensesPage,users:usersPage})[currentPage]()}</section>`;

function productSalesStats(){
  const soldById=new Map(),soldByName=new Map();
  const products=state.products||[];
  for(const doc of state.documents||[]){
    const isReturn=doc.type==='Avoir';
    if(!isReturn&&!['Ticket','Facture'].includes(doc.type))continue;
    for(const item of doc.items||[]){
      let productId=item.productId;
      let productName=item.productName||item.name||'';
      if(isReturn&&!productId){
        const returnName=String(item.name||'').replace(/^\[RETOUR\]\s*/,'');
        const product=products.find(p=>returnName.startsWith(`${p.name} (`));
        if(!product)continue;
        productId=product.id;
        productName=product.name;
      }
      const quantity=Number(item.qty);
      if(!Number.isFinite(quantity)||quantity<=0)continue;
      const counts=productId?soldById:soldByName;
      const key=productId||productName.trim().toLocaleLowerCase('fr');
      counts.set(key,(counts.get(key)||0)+quantity*(isReturn?-1:1));
    }
  }
  return products.map(product=>({
    name:product.name,
    quantity:Math.max(0,(soldById.get(product.id)||0)+(soldByName.get(product.name.trim().toLocaleLowerCase('fr'))||0))
  }));
}

function documentProfit(doc){
  if(!['Ticket','Facture','Avoir'].includes(doc.type))return 0;
  const lineTotals=(doc.items||[]).reduce((totals,item)=>{
    const quantity=Number(item.qty)||0;
    const salePrice=Number(item.price)||0;
    const productName=String(item.productName||item.name||'').replace(/^\[RETOUR\]\s*/,'').toLocaleLowerCase('fr');
    const product=state.products.find(p=>p.id===item.productId)||state.products.find(p=>p.name.toLocaleLowerCase('fr')===productName)||state.products.find(p=>doc.type==='Avoir'&&productName.startsWith(`${p.name.toLocaleLowerCase('fr')} (`));
    const purchasePrice=Number(item.cost??product?.cost)||0;
    totals.sales+=salePrice*quantity;
    totals.cost+=purchasePrice*quantity;
    return totals;
  },{sales:0,cost:0});
  if(doc.type==='Avoir'){
    if(Number.isFinite(Number(doc.profit)))return Number(doc.profit);
    return lineTotals.cost-lineTotals.sales;
  }
  return Number(doc.total??lineTotals.sales)-lineTotals.cost;
}
function cashStatsForDate(date){
  const day=date.toDateString();
  const documents=(state.documents||[]).filter(doc=>new Date(doc.date).toDateString()===day&&['Ticket','Facture','Avoir'].includes(doc.type));
  const returns=documents.filter(doc=>doc.type==='Avoir');
  return{
    sales:documents.reduce((sum,doc)=>sum+(doc.type==='Avoir'?-1:1)*(Number(doc.total)||0),0),
    profit:documents.reduce((sum,doc)=>sum+documentProfit(doc),0),
    count:documents.filter(doc=>doc.type!=='Avoir').length,
    returns:{
      count:returns.length,
      total:returns.reduce((sum,doc)=>sum+(Number(doc.total)||0),0),
      refunded:returns.filter(doc=>doc.payment!=='Avoir').reduce((sum,doc)=>sum+(Number(doc.total)||0),0),
      credit:returns.filter(doc=>doc.payment==='Avoir').reduce((sum,doc)=>sum+(Number(doc.total)||0),0)
    }
  };
}

function cleanPhoneForWhatsApp(phone){
  if(!phone) return '';
  let cleaned = String(phone).replace(/[^\d+]/g, '');
  if(cleaned.startsWith('+')) cleaned = cleaned.slice(1);
  else if(cleaned.startsWith('00')) cleaned = cleaned.slice(2);
  // Préfixe indicatif Congo (+242) par défaut si 9 chiffres commençant par 0 ou sans indicatif
  if(cleaned.length === 9 && (cleaned.startsWith('06') || cleaned.startsWith('05') || cleaned.startsWith('04'))) {
    cleaned = '242' + cleaned.slice(1);
  } else if(cleaned.length === 8) {
    cleaned = '242' + cleaned;
  }
  return cleaned;
}

function openWhatsApp(phone, text=''){
  const num = cleanPhoneForWhatsApp(phone);
  if(!num) return toast('Numéro WhatsApp non renseigné.', true);
  const url = `https://wa.me/${num}${text ? '?text=' + encodeURIComponent(text) : ''}`;
  window.open(url, '_blank');
}

function sendDocumentWhatsApp(docId){
  const doc = (state.documents||[]).find(d=>d.id===docId);

  const contact = doc.clientWhatsapp || doc.clientPhone;
  if(!contact) return toast('Aucun numéro WhatsApp ou téléphone renseigné pour ce client.', true);
  const itemsText = doc.items.map(it=>`• ${it.name} (x${it.qty}) : ${money(it.price * it.qty)}`).join('\n');
  const msg = `Bonjour ${doc.client},\n\nVoici le récapitulatif de votre ${doc.type} N° *${doc.id}* chez *Shop Kosomba* :\n\n${itemsText}\n\n*Total net : ${money(doc.total)}*\nStatut : ${doc.status}${doc.payment ? ' (' + doc.payment + ')' : ''}\nDate : ${dateFmt(doc.date)}\n\nMerci de votre confiance !`;
  openWhatsApp(contact, msg);
}

  if(!can('Factures') && !can('Ventes')) return toast('Permission Factures ou Ventes requise.', true);
  let form = document.getElementById('client-form');
  if(!form || !form.reportValidity()) return;
  let fd = new FormData(form);
  let name = String(fd.get('name') || '').trim();
  let whatsapp = String(fd.get('whatsapp') || '').trim();
  let phone = String(fd.get('phone') || '').trim();
  let email = String(fd.get('email') || '').trim().toLowerCase();
  let address = String(fd.get('address') || '').trim();
  let notes = String(fd.get('notes') || '').trim();

  if(!name) return toast('Le nom du client est obligatoire.', true);
  if(!state.clients) state.clients = [];

  let clientObj;
  if(id){
    clientObj = state.clients.find(x => x.id === id);
    if(clientObj){
      Object.assign(clientObj, { name, whatsapp, phone, email, address, notes });
      log(`Fiche client mise à jour : <strong>${esc(name)}</strong>`, 'contact');
    }
  } else {
    clientObj = {
      id: 'c' + Date.now(),
      name,
      whatsapp,
      phone,
      email,
      address,
      notes,
      createdAt: new Date().toISOString()
    };
    state.clients.unshift(clientObj);
    log(`Nouveau client enregistré : <strong>${esc(name)}</strong>`, 'contact');
  }

  if(fromPos && clientObj){
    selectedClientId = clientObj.id;
  }

  const ok = await save();
  if(ok){
    closeModal();
    render();
    toast(id ? 'Client mis à jour avec succès' : 'Client ajouté au fichier clients');
  }
}

async function deleteClient(id){
  if(!can('Factures') && !can('Utilisateurs')) return toast('Permission requise pour supprimer un client.', true);
  if(!state.clients) state.clients = [];
  let c = state.clients.find(x => x.id === id);
  if(!c) return;
  if(!confirm(`Supprimer définitivement le client « ${c.name} » ?`)) return;
  state.clients = state.clients.filter(x => x.id !== id);
  if(selectedClientId === id) selectedClientId = '';
  const ok = await save();
  if(ok){
    render();
    toast('Client supprimé de la base de données');
  }
}

function exportClientsExcel(){
  if (typeof XLSX === 'undefined') return toast('Bibliothèque Excel non disponible.', true);
  if (!state.clients) state.clients = [];
  if (state.clients.length === 0) return toast('Aucun client enregistré à exporter.', true);

  const clientPurchases = {};
  (state.documents||[]).forEach(d => {
    if(!d.client || d.client === 'Client comptoir') return;
    const key = d.client.toLowerCase();
    if(!clientPurchases[key]) clientPurchases[key] = { count: 0, total: 0 };
    clientPurchases[key].count++;
    clientPurchases[key].total += d.total;
  });

  const rows = state.clients.map(c => {
    const stats = clientPurchases[c.name.toLowerCase()] || { count: 0, total: 0 };
    return {
      'Identifiant': c.id,
      'Nom complet / Société': c.name,
      'Numéro WhatsApp': c.whatsapp || '',
      'Téléphone appel': c.phone || '',
      'Adresse e-mail': c.email || '',
      'Adresse / Ville': c.address || '',
      'Nombre de commandes': stats.count,
      'Total des achats (FCFA)': stats.total,
      'Observations / Notes': c.notes || '',
      'Date d\'enregistrement': c.createdAt ? new Date(c.createdAt).toLocaleDateString('fr-FR') : ''
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Clients Shop Kosomba');
  XLSX.writeFile(wb, `base_clients_shop_kosomba_${new Date().toISOString().split('T')[0]}.xlsx`);
  toast('Export Excel de la base clients téléchargé avec succès');
  log('Export de la base clients (Excel).', 'download');
}

function exportClientsCsv(){
  if (!state.clients) state.clients = [];
  if (state.clients.length === 0) return toast('Aucun client enregistré à exporter.', true);

  let csv = 'Identifiant,Nom,WhatsApp,Telephone,Email,Adresse,Observations,DateEnregistrement\n';
  state.clients.forEach(c => {
    csv += `"${c.id}","${(c.name||'').replace(/"/g,'""')}","${(c.whatsapp||'').replace(/"/g,'""')}","${(c.phone||'').replace(/"/g,'""')}","${(c.email||'').replace(/"/g,'""')}","${(c.address||'').replace(/"/g,'""')}","${(c.notes||'').replace(/"/g,'""')}","${c.createdAt ? new Date(c.createdAt).toLocaleDateString('fr-FR') : ''}"\n`;
  });

  let blob = new Blob([new Uint8Array([0xEF,0xBB,0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
  let link = document.createElement('a');
  link.href = URL.createObjectURL(blob);

async function saveExpense(id){
  let f = document.getElementById('expense-form');
  if(!f || !f.reportValidity()) return;
  let fd = new FormData(f);
  let nature = String(fd.get('nature')||'').trim();
  let amount = Math.abs(Number(fd.get('amount'))||0);
  let payment = String(fd.get('payment')||'Espèce').trim();
  let dateVal = String(fd.get('date')||new Date().toISOString());
  let description = String(fd.get('description')||'').trim();

  if(!nature){
    return toast('La nature de la dépense est strictement obligatoire !', true);
  }
  if(!amount || amount <= 0){
    return toast('Veuillez saisir un montant valide.', true);
  }

  if(!state.expenses) state.expenses = [];
  if(id){
    let existing = state.expenses.find(x => x.id === id);
    if(existing){
      Object.assign(existing, { nature, amount, payment, date: new Date(dateVal).toISOString(), description });
      log(`Dépense modifiée : <strong>${esc(nature)}</strong> (${money(amount)})`, 'receipt');
    }
  } else {
    let newExp = {
      id: 'exp_' + Date.now(),
      nature,
      amount,
      payment,
      date: new Date(dateVal).toISOString(),
      description,
      recordedBy: currentUser?.name || 'Admin'
    };
    state.expenses.unshift(newExp);
    log(`Nouvelle dépense enregistrée : <strong>${esc(nature)}</strong> (${money(amount)})`, 'receipt');
  }

  const ok = await save();
  if(ok){
    closeModal();
    render();
    toast(id ? 'Dépense mise à jour' : 'Dépense enregistrée avec succès');
  }
}

async function deleteExpense(id){
  if(!can('Factures') && !can('Stock')) return toast('Permission Factures requise.', true);
  let exp = (state.expenses||[]).find(x => x.id === id);
  if(!exp) return;
  if(!confirm(`Supprimer la dépense « ${exp.nature} » de ${money(exp.amount)} ?`)) return;
  state.expenses = state.expenses.filter(x => x.id !== id);
  const ok = await save();
  if(ok){
    render();
    toast('Dépense supprimée');
  }
}

function importProducts(event){
  if(!can('Stock')) return toast('Permission Stock requise.', true);
  let file = event.target.files?.[0];
  if(!file) return;

  if (file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf') {
    event.target.value = '';
    modal('Format de fichier non supporté (PDF)', `
      <div class="modal-body" style="text-align:center;padding:20px 10px">
        <div style="width:52px;height:52px;margin:0 auto 12px;background:#fef2f2;color:var(--red);border-radius:50%;display:grid;place-items:center;font-size:24px">
          ${icon('file-x')}
        </div>
        <h3 style="margin:0 0 8px;font-size:16px">Les fichiers PDF ne peuvent pas être importés directement</h3>
        <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 16px">
          Les fichiers <strong>PDF</strong> sont des documents d'impression qui ne contiennent pas de tableau structuré de données.<br><br>
          Pour importer vos produits rapidement et sans erreur, veuillez utiliser un fichier <strong>Excel (.xlsx, .xls)</strong> ou <strong>CSV</strong> avec les colonnes : <em>Désignation, Quantité, Prix de vente, Prix d'achat, Catégorie</em>.
        </p>
        <button class="button" onclick="exportStockExcel()">${icon('download')} Télécharger la trame Excel exemple</button>
      </div>
    `, `<button class="button primary" onclick="closeModal()">J'ai compris</button>`);
    return;
  }

  if (typeof XLSX === 'undefined') {
    return toast('Bibliothèque Excel en cours de chargement. Réessayez dans un instant.', true);
  }

  let reader = new FileReader();
  reader.onload = async(e) => {
    try {
      let data = new Uint8Array(e.target.result);
      let workbook = XLSX.read(data, { type: 'array' });
      let added = 0;

      for (const sheetName of workbook.SheetNames) {
        let sheet = workbook.Sheets[sheetName];
        let rows = XLSX.utils.sheet_to_json(sheet);
        if (!rows || !rows.length) continue;

        for (let index = 0; index < rows.length; index++) {
          const r = rows[index];
          const keys = Object.keys(r);
          if (!keys.length) continue;

          // Détection intelligente du Nom / Désignation du produit
          let nameKey = keys.find(k => /^(name|nom|produit|designation|d[eé]signation|article|libelle|libell[eé]|description)$/i.test(k.trim()));
          if (!nameKey) {
            nameKey = keys.find(k => {
              const trimmed = k.trim();
              if (/^(n[°o]|id|code|q|qte|quantit[eé]|stock|achat|vente|total|t-a|t-vente|four|date)$/i.test(trimmed)) return false;
              const val = r[k];
              return typeof val === 'string' && val.trim().length > 1;
            });
          }

          const rawName = nameKey ? String(r[nameKey]).trim() : '';
          if (!rawName || /^total$/i.test(rawName) || /^n[°o]$/i.test(rawName)) continue;

          // Quantité / Stock
          let stockKey = keys.find(k => /^(stock|quantit[eé]|qte|q|qty|disponible|nombre)$/i.test(k.trim()));
          let stockVal = stockKey !== undefined ? r[stockKey] : 0;
          let stock = parseInt(String(stockVal).replace(/[^\d-]/g, ''), 10);
          if (isNaN(stock) || stock < 0) stock = 0;

          // Prix de vente (Vente)
          let priceKey = keys.find(k => /^(price|prix|vente\s*s?|pv|prix\s*(?:de\s*)?vente)$/i.test(k.trim()) && !/^t(?:otal)?-?vente/i.test(k.trim()));
          let priceVal = priceKey !== undefined ? r[priceKey] : 0;
          let price = parseFloat(String(priceVal).replace(/[^\d.,]/g, '').replace(',', '.')) || 0;

          // Prix d'achat (Achat)
          let costKey = keys.find(k => /^(cost|co[uû]t|achat|pa|prix\s*(?:d['’]\s*)?achat)$/i.test(k.trim()) && !/^t(?:otal)?-?a/i.test(k.trim()));
          let costVal = costKey !== undefined ? r[costKey] : 0;
          let cost = parseFloat(String(costVal).replace(/[^\d.,]/g, '').replace(',', '.')) || 0;

          // Catégorie
          let catKey = keys.find(k => /^(category|cat[eé]gorie|famille|rayon)$/i.test(k.trim()));
          let category = catKey ? String(r[catKey]).trim() : '';
          if (!category) {
            if (nameKey && nameKey.length > 3 && !/^(nom|name|produit|article)$/i.test(nameKey)) {
              let cleaned = nameKey.trim();
              category = cleaned.charAt(0).toUpperCase() + cleaned.slice(1).toLowerCase();
            } else {
              category = sheetName && sheetName !== 'Feuil1' && sheetName !== 'Sheet1' && sheetName !== 'DISPONIBLE' ? sheetName : 'Général';
            }
          }

          // Référence (SKU)
          let skuKey = keys.find(k => /^(sku|ref|r[eé]f[eé]rence|code)$/i.test(k.trim()));
          let sku = skuKey ? String(r[skuKey]).trim() : '';
          if (!sku) {
            const numKey = keys.find(k => /^n[°o]$/i.test(k.trim()));
            const numVal = numKey ? String(r[numKey]).trim() : '';
            sku = numVal ? `ART-${numVal.padStart(3, '0')}` : `ART-${String(state.products.length + added + 1).padStart(3, '0')}`;
          }

          // Code-barres
          let barcodeKey = keys.find(k => /^(barcode|code-?barres?|ean|upc)$/i.test(k.trim()));
          let barcode = barcodeKey ? String(r[barcodeKey]).trim() : '';

          let d = {
            id: 'p' + Date.now() + added,
            name: rawName,
            sku,
            category,
            price,
            cost,
            stock,
            threshold: 5,
            barcode,
            photo: ''
          };
          state.products.push(d);
          added++;
        }
      }

      if (added > 0) {
        log(`${added} produit(s) importé(s) depuis Excel.`, 'package-plus');
        await save();
        render();
        toast(`${added} produit(s) importé(s) avec succès !`);
      } else {
        toast('Aucun produit valide trouvé dans le fichier Excel.', true);
      }
    } catch (err) {
      console.error('Erreur import:', err);
      toast('Erreur lors de la lecture du fichier Excel: ' + (err.message || 'Format non reconnu'), true);
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}
function addToCart(id){
  let p=state.products.find(x=>x.id===id),item=cart.find(x=>x.id===id);
  if(item){
    if(item.qty>=p.stock)return toast('Stock disponible insuffisant.',true);
    item.qty++;
  }else{
    cart.push({id:p.id,name:p.name,price:p.price,qty:1});
  }
  render();
  if(window.innerWidth<=720){
    const cp=document.querySelector('.cart-panel');
    if(cp)cp.classList.add('open');
  }
}
function cartSubtotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}
function cartDiscountAmount(){
  let sub = cartSubtotal();
  if(!cartDiscount || cartDiscount <= 0) return 0;
  if(cartDiscountType === 'percent'){
    return Math.min(sub, Math.round(sub * (Math.min(100, cartDiscount) / 100)));
  }
  return Math.min(sub, Math.round(cartDiscount));
}
function cartTotal(){
  return Math.max(0, cartSubtotal() - cartDiscountAmount());
}
function setCartDiscount(val, type){
  cartDiscount = Math.max(0, Number(val)||0);
  if(type) cartDiscountType = type;
  const subtotal=cartSubtotal(),discount=cartDiscountAmount(),total=Math.max(0,subtotal-discount);
  document.getElementById('cart-subtotal').textContent=money(subtotal);
  document.getElementById('cart-discount-line').style.display=discount>0?'flex':'none';
  document.getElementById('cart-discount-amount').textContent=money(discount);
  document.getElementById('cart-total').textContent=money(total);
  document.getElementById('checkout-total').textContent=money(total);
}
function clearCart(){cart=[];cartDiscount=0;render()}
function setSaleType(type){saleType=type;render()}
function setPaymentMode(mode){paymentMode=mode;render()}

  if(!can('Ventes')||!can('Stock'))return toast('Permissions Ventes et Stock requises.',true);
  if(!cart.length)return;
  let clientObj = selectedClientId ? (state.clients||[]).find(c=>c.id===selectedClientId) : null;
  if((!clientObj || clientObj.name === 'Client comptoir') && (saleType==='Facture'||saleType==='Proforma')){
    return promptClientForCheckout(saleType);

}

async function submitQuickClientForCheckout(){
  const nameInp = document.getElementById('qsc-name');
  const name = nameInp ? nameInp.value.trim() : '';
  if(!name) return toast('Le nom du client est obligatoire pour ce document.', true);
  const phone = document.getElementById('qsc-phone')?.value.trim() || '';
  const address = document.getElementById('qsc-address')?.value.trim() || '';

  if(!state.clients) state.clients = [];
  let clientObj = state.clients.find(c => c.name.toLowerCase() === name.toLowerCase());
  if(clientObj){
    if(phone){ clientObj.whatsapp = phone; clientObj.phone = phone; }
    if(address) clientObj.address = address;
  } else {
    clientObj = {
      id: 'c' + Date.now(),
      name,
      whatsapp: phone,
      phone,
      email: '',
      address,
      notes: 'Ajouté en caisse',
      createdAt: new Date().toISOString()
    };
    state.clients.unshift(clientObj);
  }
  selectedClientId = clientObj.id;
  closeModal();
  await finishCheckout(clientObj);
}

async function finishCheckout(clientObj){
  if(checkoutInProgress)return;
  checkoutInProgress=true;
  try{
    await completeCheckout(clientObj);
  }finally{
    checkoutInProgress=false;
  }
}

async function completeCheckout(clientObj){
  let clientName = clientObj ? clientObj.name : 'Client comptoir';
  let clientPhone = clientObj ? (clientObj.whatsapp || clientObj.phone || '') : '';
  let clientWhatsapp = clientObj ? (clientObj.whatsapp || '') : '';
  let clientAddress = clientObj ? (clientObj.address || '') : '';

  const prefixes={Ticket:'TCK',Facture:'FAC',Proforma:'PRO'};
  let prefix=prefixes[saleType]||'DOC';
  let sequence=String(state.documents.filter(d=>d.type===saleType).length+1).padStart(4,'0');
  const statusMap={Ticket:'Payé',Facture:paymentMode==='Avance'?'Avance':'Payée',Proforma:'En attente'};
  let doc={
    id:`${prefix}-${new Date().getFullYear()}-${sequence}`,
    type:saleType,
    date:new Date().toISOString(),
    client:clientName,
    clientPhone:clientPhone,
    clientWhatsapp:clientWhatsapp,
    clientAddress:clientAddress,
    total:Number(cartTotal().toFixed(2)),
    subtotal:Number(cartSubtotal().toFixed(2)),
    discount:Number(cartDiscountAmount().toFixed(2)),
    discountType:cartDiscountType,
    status:statusMap[saleType]||'Payé',
    payment:saleType==='Proforma'?'':paymentMode,
    items:cart.map(i=>({productId:i.id,name:i.name,qty:i.qty,price:i.price,cost:Number(state.products.find(p=>p.id===i.id)?.cost)||0}))
  };

  if(saleType!=='Proforma'){
    for(const i of cart){let p=state.products.find(x=>x.id===i.id);if(p)p.stock-=i.qty}
  }
  state.documents.unshift(doc);
  log(`${saleType} <strong>${doc.id}</strong> créée pour ${money(doc.total)}.`,'circle-check');
  const ok = await save();
  cart=[];
  cartDiscount=0;
  selectedClientId='';
  render();
  if(ok){
    showDocument(doc.id);
    toast(saleType==='Proforma'?'Facture proforma générée avec succès':'Vente enregistrée et stock mis à jour');
  }
}

function restockFromProforma(id){
  if(!can('Stock')) return toast('Permission Stock requise.', true);
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return toast('Document introuvable.', true);
  if(!confirm(`Réapprovisionner le stock de la boutique à partir des articles de ${doc.id} ?\nLes quantités seront ajoutées au stock.`)) return;

  let addedCount = 0;
  for(const it of doc.items){
    let p = state.products.find(x => x.name.toLowerCase() === it.name.toLowerCase());
    if(p){
      p.stock += it.qty;
      addedCount += it.qty;
    } else {
      state.products.unshift({
        id: 'p' + Date.now() + Math.random().toString(36).substring(2,5),
        name: it.name,
        sku: 'APPR-' + String(state.products.length + 1).padStart(3, '0'),
        category: 'Approvisionnement',
        price: it.price * 1.25,
        cost: it.price,
        stock: it.qty,
        threshold: 5,
        barcode: '',
        photo: ''
      });
      addedCount += it.qty;
    }
  }
  doc.status = 'Stock approvisionné';
  log(`Stock réapprovisionné depuis <strong>${doc.id}</strong> (+${addedCount} articles).`, 'package-plus');
  save().then(ok => {
    if(ok){
      render();
      toast(`Stock réapprovisionné avec succès (+${addedCount} unités)`);
    }
  });
}

function updateReturnMax(idx, docId){
  const doc = state.documents.find(d => d.id === docId);
  if(!doc) return;
  const item = doc.items[idx];
  const input = document.getElementById('ret-qty');
  if(item && input){
    input.max = item.qty;
    input.value = Math.min(input.value || 1, item.qty);
  }
}

async function processProductReturn(docId){
  const doc = state.documents.find(d => d.id === docId);
  if(!doc) return;
  const idx = parseInt(document.getElementById('ret-item-index').value, 10);
  const qty = parseInt(document.getElementById('ret-qty').value, 10);
  const refundMode = document.getElementById('ret-refund-mode').value;
  const reason = document.getElementById('ret-reason').value.trim();

  const item = doc.items[idx];
  if(!item || isNaN(qty) || qty <= 0 || qty > item.qty){
    return toast('Quantité de retour invalide.', true);
  }
  if(!reason){
    return toast('Le motif du retour est requis.', true);
  }

  // 1. Réintégration du stock
  let p = state.products.find(x => x.id === item.productId)||state.products.find(x => x.name.toLowerCase() === item.name.toLowerCase());
  if(p){
    p.stock += qty;
  }

  // 2. Création de l'avoir / ticket de retour
  const purchasePrice=Number(item.cost??p?.cost)||0;
  const saleSubtotal=Number(doc.subtotal)||doc.items.reduce((sum,line)=>sum+(Number(line.price)||0)*(Number(line.qty)||0),0);
  const discountRatio=saleSubtotal>0?Math.max(0,Number(doc.total)||0)/saleSubtotal:1;
  let refundTotal = item.price * qty * discountRatio;
  const reversedProfit=(purchasePrice-(Number(item.price)||0)*discountRatio)*qty;
  let seq = String(state.documents.filter(d => d.type === 'Avoir').length + 1).padStart(4, '0');
  let returnDoc = {
    id: `AVOIR-${new Date().getFullYear()}-${seq}`,
    type: 'Avoir',
    date: new Date().toISOString(),
    client: doc.client,
    clientPhone: doc.clientPhone || '',
    clientWhatsapp: doc.clientWhatsapp || '',
    clientAddress: doc.clientAddress || '',
    total: refundTotal,
    profit: reversedProfit,
    status: refundMode === 'Avoir' ? 'Avoir client' : 'Remboursé',
    payment: refundMode,
    items: [{ productId: p?.id||item.productId, productName:item.name, name: `[RETOUR] ${item.name} (${reason})`, qty, price: item.price, cost:purchasePrice }]
  };

  state.documents.unshift(returnDoc);
  log(`Retour marchandise sur ${doc.id} : <strong>${esc(item.name)}</strong> (x${qty}) réintégré au stock. Remboursement : ${money(refundTotal)}.`, 'undo-2');

  const ok = await save();
  if(ok){
    closeModal();
    render();
    showDocument(returnDoc.id);
    toast(`Retour validé : +${qty} ${item.name} réintégré au stock`);
  }
}

function convertProforma(id){if(!can('Ventes')||!can('Stock'))return toast('Permissions Ventes et Stock requises.',true);const proforma=state.documents.find(d=>d.id===id);if(!proforma||proforma.type!=='Proforma')return toast('Proforma introuvable.',true);if(!confirm(`Convertir ${proforma.id} en facture définitive ?\nLe stock sera déduit.`))return;const pm=prompt('Mode de paiement (Espèce / Momo / Avance) :','Espèce');if(!pm)return;const payment=['Espèce','Momo','Avance'].includes(pm)?pm:'Espèce';let sequence=String(state.documents.filter(d=>d.type==='Facture').length+1).padStart(4,'0');const facture={id:`FAC-${new Date().getFullYear()}-${sequence}`,type:'Facture',date:new Date().toISOString(),client:proforma.client,clientPhone:proforma.clientPhone||'',clientWhatsapp:proforma.clientWhatsapp||'',clientAddress:proforma.clientAddress||'',subtotal:proforma.subtotal??proforma.total,discount:proforma.discount||0,discountType:proforma.discountType||'amount',total:proforma.total,status:payment==='Avance'?'Avance':'Payée',payment,items:[...proforma.items]};for(const item of facture.items){let p=state.products.find(x=>x.name===item.name);if(p){if(p.stock<item.qty)return toast(`Stock insuffisant pour ${item.name}.`,true);p.stock-=item.qty}}proforma.status='Convertie';state.documents.unshift(facture);log(`Proforma ${proforma.id} convertie en facture <strong>${facture.id}</strong>.`,'file-check');save().then(ok=>{if(ok){render();showDocument(facture.id);toast(`Facture ${facture.id} créée à partir de ${proforma.id}`)}})}

let printInProgress=false;
let printButtonInProgress=null;
function releasePrintLock(){
  printInProgress=false;
  if(printButtonInProgress){
    printButtonInProgress.disabled=false;
    printButtonInProgress.removeAttribute('aria-busy');
    printButtonInProgress=null;
  }
}
window.addEventListener('afterprint',releasePrintLock);
function printDocument(button){
  if(printInProgress)return;
  printInProgress=true;
  printButtonInProgress=button;
  if(button){
    button.disabled=true;
    button.setAttribute('aria-busy','true');
  }
  try{
    window.print();
  }catch(error){
    releasePrintLock();
    throw error;
  }
}

function openUser(id=''){if(!can('Utilisateurs'))return toast('Permission Utilisateurs requise.',true);let u=state.users.find(x=>x.id===id)||{name:'',email:'',role:'Vendeur',permissions:['Ventes','Stock'],active:true},perms=['Ventes','Stock','Factures','Utilisateurs'];modal(id?'Modifier le membre':'Inviter un membre',`<div class="modal-body"><form id="user-form" class="field-grid"><div class="field"><label>Nom complet</label><input name="name" required value="${esc(u.name)}" placeholder="Prénom Nom"></div><div class="field"><label>Adresse e-mail</label><input name="email" type="email" required value="${esc(u.email)}" placeholder="nom@shopkosomba.cg"></div><div class="field"><label>Rôle</label><select name="role" onchange="setRolePermissions(this.value)">${['Administratrice','Vendeur','Gestionnaire de stock','Comptable','Personnalisé'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Statut du compte</label><select name="active"><option value="true" ${u.active?'selected':''}>Actif</option><option value="false" ${!u.active?'selected':''}>Désactivé</option></select></div><div class="field full"><label>${id?'Nouveau mot de passe (facultatif)':'Mot de passe initial (12 caractères minimum)'}</label><input name="password" type="password" ${id?'':'required minlength="12"'} autocomplete="new-password"></div><div class="field full"><label>Permissions d’accès</label><div class="permission-list" id="permission-list">${perms.map(p=>`<label class="permission-option"><input type="checkbox" name="permissions" value="${p}" ${u.permissions.includes(p)?'checked':''}>${p}</label>`).join('')}</div></div></form></div>`,`<button class="button" onclick="closeModal()">Annuler</button><button class="button primary" onclick="saveUser('${id}')">${id?'Enregistrer':'Ajouter le membre'}</button>`,true)}
function setRolePermissions(role){let sets={'Administratrice':['Ventes','Stock','Factures','Utilisateurs'],'Vendeur':['Ventes','Stock'],'Gestionnaire de stock':['Stock','Factures'],'Comptable':['Factures']},allowed=sets[role];if(!allowed)return;document.querySelectorAll('#permission-list input').forEach(c=>c.checked=allowed.includes(c.value))}
function saveUser(id){if(!can('Utilisateurs'))return toast('Permission Utilisateurs requise.',true);let f=document.getElementById('user-form');if(!f.reportValidity())return;let fd=new FormData(f),password=fd.get('password'),d={name:fd.get('name').trim(),email:fd.get('email').trim(),role:fd.get('role'),active:fd.get('active')==='true',permissions:fd.getAll('permissions')};if(id)Object.assign(state.users.find(u=>u.id===id),d);else{d.id='u'+Date.now();state.users.push(d)}if(password)pendingPasswords[d.id]=password;log(`${id?'Accès modifiés pour':'Nouveau membre ajouté :'} <strong>${esc(d.name)}</strong>`,'users-round');save().then(ok=>{if(ok){closeModal();render();toast(id?'Membre mis à jour':'Membre ajouté à l’équipe')}})}
function deleteUser(id){if(!can('Utilisateurs'))return toast('Permission Utilisateurs requise.',true);if(id===currentUser.id)return toast('Vous ne pouvez pas supprimer votre propre compte.',true);let u=state.users.find(x=>x.id===id);if(!confirm(`Supprimer le compte de ${u.name} ?`))return;state.users=state.users.filter(x=>x.id!==id);save().then(ok=>{if(ok){render();toast('Membre supprimé')}})}

async function syncDatabaseAuto(){
  if(!currentUser||savingCount||pollBusy||isOfflineMode)return;
  pollBusy=true;
  try{
    const result=await api('/api/state');
    if(result && result.revision!==stateRevision){
      state=result.state;
      stateRevision=result.revision;
      if (!state.clients) state.clients = [];
      if (!state.expenses) state.expenses = [];
      syncIdentity();
      render();
    }
    await refreshNotifications();
  }catch(error){
    if(error.status===401)await logout();
  }finally{
    pollBusy=false;
  }
}
setInterval(syncDatabaseAuto, 3000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') syncDatabaseAuto(); });
window.addEventListener('focus', syncDatabaseAuto);
